<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify OTP | AASRAA Skillability Centre</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="/css/verify-otp.css"
    >

</head>

<body>

    <!-- ==========================
            NAVBAR
    =========================== -->

    <nav class="navbar navbar-light bg-white shadow-sm">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                href="/"
            >

                <img
                    src="/images/logo.png"
                    alt="AASRAA Logo"
                    width="40"
                    height="40"
                    class="me-2"
                >

                Skillability Centre

            </a>

        </div>

    </nav>


    <!-- ==========================
            OTP SECTION
    =========================== -->

    <section class="login-section">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-6">

                    <div class="login-card">

                        <div class="text-center mb-4">

                            <i
                                class="bi bi-shield-lock-fill text-primary"
                                style="font-size: 45px;"
                            ></i>

                            <h2 class="mt-3">

                                Verify OTP

                            </h2>

                            <p>

                                Enter the 6-digit OTP sent to your registered email.

                            </p>

                        </div>


                        <!-- MESSAGE -->

                        <div
                            id="message"
                            class="alert d-none"
                            role="alert"
                        ></div>


                        <!-- OTP FORM -->

                        <form id="verifyOtpForm">

                            <div class="mb-4">

                                <label
                                    for="otp"
                                    class="form-label"
                                >

                                    Enter OTP

                                </label>

                                <input
                                    type="text"
                                    class="form-control text-center"
                                    id="otp"
                                    maxlength="6"
                                    inputmode="numeric"
                                    autocomplete="one-time-code"
                                    placeholder="Enter 6-digit OTP"
                                    required
                                >

                            </div>


                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-primary btn-lg"
                                    id="verifyOtpBtn"
                                >

                                    <i class="bi bi-check-circle-fill"></i>

                                    Verify OTP

                                </button>

                            </div>

                        </form>


                        <!-- BACK TO LOGIN -->

                        <div class="text-center mt-4">

                            <a href="/login">

                                <i class="bi bi-arrow-left"></i>

                                Back to Login

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- FOOTER -->

    <footer class="text-center py-3">

        <div class="container">

            <p class="mb-0">

                © 2026 AASRAA Skillability Centre

            </p>

        </div>

    </footer>


    <!-- OTP JS -->

    <script src="/js/verify-otp.js"></script>

</body>

</html>

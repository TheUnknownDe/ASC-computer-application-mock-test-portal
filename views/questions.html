<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
                META TAGS
    =========================================== -->

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>

        Manage Questions | AASRAA Skillability Centre

    </title>

    <!-- Bootstrap CSS -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Questions CSS -->

    <link rel="stylesheet" href="/css/questions.css">

</head>
<body>
<!-- ==========================================
                NAVBAR
========================================== -->

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/admin-dashboard">

            <i class="bi bi-patch-question-fill"></i>

            AASRAA Admin Panel

        </a>

        <div class="d-flex align-items-center">

            <span class="text-white me-3">

                Welcome,

                <strong id="adminName">

                    Administrator

                </strong>

            </span>

            <button class="btn btn-light" id="logoutBtn">

                <i class="bi bi-box-arrow-right"></i>

                Logout

            </button>

        </div>

    </div>

</nav>
<!-- ==========================================
                HEADER
========================================== -->

<section class="py-4">

    <div class="container">

        <div class="page-header">

            <div>

                <h2>

                    <i class="bi bi-question-circle-fill"></i>

                    Manage Questions

                </h2>

                <p class="text-muted mb-0">

                    Add, edit and manage all quiz questions.

                </p>

            </div>

            <div>

                <button class="btn btn-primary" id="dashboardBtn">

                    <i class="bi bi-house-door-fill"></i>

                    Dashboard

                </button>

            </div>

        </div>

    </div>

</section>
<!-- ==========================================
            ANALYTICS CARDS
========================================== -->

<section>

    <div class="container">

        <div class="row g-4">

            <div class="col-lg-3 col-md-6">

                <div class="card stat-card">

                    <div class="card-body text-center">

                        <i class="bi bi-list-check display-5 text-primary"></i>

                        <h6 class="mt-3">

                            Total Questions

                        </h6>

                        <h2 id="totalQuestions">

                            0

                        </h2>

                    </div>

                </div>

            </div>

            <div class="col-lg-3 col-md-6">

                <div class="card stat-card">

                    <div class="card-body text-center">

                        <i class="bi bi-filetype-py display-5 text-success"></i>

                        <h6 class="mt-3">

                            Python

                        </h6>

                        <h2 id="pythonQuestions">

                            0

                        </h2>

                    </div>

                </div>

            </div>

            <div class="col-lg-3 col-md-6">

                <div class="card stat-card">

                    <div class="card-body text-center">

                        <i class="bi bi-filetype-html display-5 text-danger"></i>

                        <h6 class="mt-3">

                            HTML

                        </h6>

                        <h2 id="htmlQuestions">

                            0

                        </h2>

                    </div>

                </div>

            </div>

            <div class="col-lg-3 col-md-6">

                <div class="card stat-card">

                    <div class="card-body text-center">

                        <i class="bi bi-file-earmark-excel-fill display-5 text-success"></i>

                        <h6 class="mt-3">

                            Excel

                        </h6>

                        <h2 id="excelQuestions">

                            0

                        </h2>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>
<!-- ==========================================
            SEARCH & ACTIONS
========================================== -->

<section class="mt-4">

    <div class="container">

        <div class="card shadow-sm border-0">

            <div class="card-body">

                <div class="row g-3 align-items-end">

                    <!-- Search -->

                    <div class="col-lg-5">

                        <label class="form-label fw-semibold">

                            Search Question

                        </label>

                        <input type="text" class="form-control" id="searchInput" placeholder="Search question...">

                    </div>

                    <!-- Subject Filter -->

                    <div class="col-lg-3">

                        <label class="form-label fw-semibold">

                            Subject

                        </label>

                        <select class="form-select" id="subjectFilter">

                            <option value="All">

                                All Subjects

                            </option>

                            <option value="Python">

                                Python

                            </option>

                            <option value="HTML">

                                HTML

                            </option>

                            <option value="Excel">

                                Excel

                            </option>

                        </select>

                    </div>

                    <!-- Add Question -->

                    <div class="col-lg-4 d-grid">

                        <button class="btn btn-success" id="addQuestionBtn">

                            <i class="bi bi-plus-circle-fill"></i>

                            Add New Question

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>
<!-- ==========================================
            QUESTIONS TABLE
========================================== -->

<section class="mt-4 mb-5">

    <div class="container">

        <div class="card shadow-sm border-0">

            <div class="card-header bg-primary text-white">

                <h5 class="mb-0">

                    <i class="bi bi-table"></i>

                    Question Bank

                </h5>

            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover table-bordered align-middle text-center">

                        <thead class="table-dark">

                            <tr>

                                <th>#</th>

                                <th>Subject</th>

                                <th>Question</th>

                                <th>Option A</th>

                                <th>Option B</th>

                                <th>Option C</th>

                                <th>Option D</th>

                                <th>Answer</th>

                                <th>Actions</th>

                            </tr>

                        </thead>

                        <tbody id="questionsTableBody">

                            <tr>

                                <td colspan="9" class="text-center text-muted py-5">

                                    <i class="bi bi-question-circle display-4"></i>

                                    <br><br>

                                    No Questions Found

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</section>
<!-- ==========================================
        ADD / EDIT QUESTION MODAL
========================================== -->

<div
    class="modal fade"
    id="questionModal"
    tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header bg-primary text-white">

                <h5
                    class="modal-title"
                    id="modalTitle">

                    Add Question

                </h5>

                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">

                </button>

            </div>

            <div class="modal-body">

                <form id="questionForm">

                    <input
                        type="hidden"
                        id="questionIndex">

                    <!-- Subject -->

                    <div class="mb-3">

                        <label class="form-label">

                            Subject

                        </label>

                        <select
                            class="form-select"
                            id="subject"
                            required>

                            <option value="">

                                Select Subject

                            </option>

                            <option value="Python">

                                Python

                            </option>

                            <option value="HTML">

                                HTML

                            </option>

                            <option value="Excel">

                                Excel

                            </option>

                        </select>

                    </div>

                    <!-- Question -->

                    <div class="mb-3">

                        <label class="form-label">

                            Question

                        </label>

                        <textarea
                            class="form-control"
                            id="question"
                            rows="3"
                            required></textarea>

                    </div>

                    <!-- Options -->

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label>Option A</label>

                            <input
                                type="text"
                                class="form-control"
                                id="optionA"
                                required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label>Option B</label>

                            <input
                                type="text"
                                class="form-control"
                                id="optionB"
                                required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label>Option C</label>

                            <input
                                type="text"
                                class="form-control"
                                id="optionC"
                                required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label>Option D</label>

                            <input
                                type="text"
                                class="form-control"
                                id="optionD"
                                required>

                        </div>

                    </div>

                    <!-- Correct Answer -->

                    <div class="mb-3">

                        <label class="form-label">

                            Correct Answer

                        </label>

                        <select
                            class="form-select"
                            id="correctAnswer"
                            required>

                            <option value="">

                                Select Answer

                            </option>

                            <option value="A">Option A</option>

                            <option value="B">Option B</option>

                            <option value="C">Option C</option>

                            <option value="D">Option D</option>

                        </select>

                    </div>

                </form>

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>

                <button
                    class="btn btn-primary"
                    id="saveQuestionBtn">

                    Save Question

                </button>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="/js/questions.js"></script>

</body>
</html>

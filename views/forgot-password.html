<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
            META TAGS
    =========================================== -->

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | AASRAA Skillability Centre</title>

    <meta name="description"
        content="Reset your AASRAA Skillability Centre student account password.">

    <!-- Bootstrap CSS -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Forgot Password CSS -->

    <link rel="stylesheet" href="/css/forgot-password.css">

</head>

<body>

    <!-- ==========================
            NAVBAR
    =========================== -->

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">

        <div class="container">

            <a class="navbar-brand fw-bold" href="/">

                <img src="/images/logo.png"
                    alt="AASRAA Logo"
                    width="40"
                    height="40"
                    class="d-inline-block align-text-top me-2">

                <i class="bi bi-mortarboard-fill text-primary"></i>

                Skillability Centre

            </a>

            <a href="/login"
                class="btn btn-outline-primary">

                <i class="bi bi-box-arrow-in-left"></i>

                Login

            </a>

        </div>

    </nav>


    <!-- ==========================
            FORGOT PASSWORD
    =========================== -->

    <section class="forgot-password-section">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-6 col-md-8">

                    <div class="forgot-password-card">

                        <!-- Header -->

                        <div class="text-center mb-4">

                            <div class="forgot-icon mb-3">

                                <i class="bi bi-key-fill"></i>

                            </div>

                            <h2>

                                Forgot Password?

                            </h2>

                            <p class="text-muted">

                                Enter your registered email address
                                to reset your password.

                            </p>

                        </div>


                        <!-- ==========================
                                EMAIL FORM
                        =========================== -->

                        <form id="forgotPasswordForm">

                            <div class="mb-4">

                                <label for="email"
                                    class="form-label">

                                    Email Address

                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">

                                        <i class="bi bi-envelope-fill"></i>

                                    </span>

                                    <input
                                        type="email"
                                        class="form-control"
                                        id="email"
                                        name="email"
                                        placeholder="Enter your registered email"
                                        autocomplete="email"
                                        required>

                                </div>

                            </div>


                            <!-- Message -->

                            <div id="message"
                                class="alert d-none"
                                role="alert">
                            </div>


                            <!-- Submit -->

                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-primary btn-lg"
                                    id="sendOtpBtn">

                                    <i class="bi bi-send-fill"></i>

                                    Send OTP

                                </button>

                            </div>

                        </form>


                        <!-- ==========================
                                BACK TO LOGIN
                        =========================== -->

                        <div class="text-center mt-4">

                            <a href="/login"
                                class="text-decoration-none">

                                <i class="bi bi-arrow-left"></i>

                                Back to Login

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- ==========================
            FOOTER
    =========================== -->

    <footer class="text-center py-3">

        <div class="container">

            <p class="mb-0">

                © 2026 AASRAA Skillability Centre |

                Computer Application Mock Test Portal

            </p>

        </div>

    </footer>


    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>


    <!-- Forgot Password JS -->

    <script src="/js/forgot-password.js"></script>

</body>

</html>

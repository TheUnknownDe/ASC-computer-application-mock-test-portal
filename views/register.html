<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
            META TAGS
    =========================================== -->

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | AASRAA Skillability Centre</title>

    <meta name="description"
        content="Create your student account to access Computer Application Mock Tests.">

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Register CSS -->

    <link rel="stylesheet" href="/css/register.css">

</head>

<body>

    <!-- ==========================
            NAVBAR
    =========================== -->

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">

        <div class="container">

            <a class="navbar-brand fw-bold" href="/">
                <img src="/images/logo.png" alt="AASRAA Logo" width="40" height="40" class="d-inline-block align-text-top me-2">

                <i class="bi bi-mortarboard-fill text-primary"></i>

                AASRAA Skillability Centre

            </a>

            <a href="/login" class="btn btn-primary btn-lg me-3">

                Login

            </a>

        </div>

    </nav>

    <!-- ==========================
            REGISTER SECTION
    =========================== -->

    <section class="register-section">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-7">

                    <div class="register-card">

                        <div class="text-center mb-4">

                            <h2>Register Yourself</h2>

                            <p>

                                Register to access topic-wise mock tests and track your performance.

                            </p>

                        </div>

                        <!-- FORM START -->

                        <form id="registerForm">

                            <!-- Full Name -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Full Name

                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="fullName"
                                    name="fullName"
                                    placeholder="Enter your full name"
                                    required>

                            </div>

                            <!-- Email -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Email Address

                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    placeholder="example@gmail.com"
                                    required>

                            </div>

                            <!-- Phone -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Mobile Number

                                </label>

                                <input
                                    type="tel"
                                    class="form-control"
                                    id="phone"
                                    name="phone"
                                    maxlength="10"
                                    placeholder="10-digit mobile number"
                                    required>

                            </div>

                            <!-- Date of Birth -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Date of Birth

                                </label>

                                <input
                                    type="date"
                                    class="form-control"
                                    id="dob"
                                    name="dob"
                                    required>

                            </div>

                            <!-- Gender -->

                            <div class="mb-3">

                                <label class="form-label d-block">

                                    Gender

                                </label>

                                <div class="form-check form-check-inline">

                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="gender"
                                        id="male"
                                        value="Male">

                                    <label class="form-check-label" for="male">

                                        Male

                                    </label>

                                </div>

                                <div class="form-check form-check-inline">

                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="gender"
                                        id="female"
                                        value="Female">

                                    <label class="form-check-label" for="female">

                                        Female

                                    </label>

                                </div>

                                <div class="form-check form-check-inline">

                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="gender"
                                        id="other"
                                        value="Other">

                                    <label class="form-check-label" for="other">

                                        Other

                                    </label>

                                </div>

                            </div>
                                                        <!-- Password -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Password

                                </label>

                                <div class="input-group">

                                    <input
                                        type="password"
                                        class="form-control"
                                        id="password"
                                        name="password"
                                        placeholder="Create a strong password"
                                        required>

                                    <button
                                        class="btn btn-outline-secondary"
                                        type="button"
                                        id="togglePassword">

                                        <i class="bi bi-eye"></i>

                                    </button>

                                </div>

                                <small class="text-muted">

                                    Password must contain at least 8 characters.

                                </small>

                            </div>

                            <!-- Confirm Password -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Confirm Password

                                </label>

                                <div class="input-group">

                                    <input
                                        type="password"
                                        class="form-control"
                                        id="confirmPassword"
                                        name="confirmPassword"
                                        placeholder="Re-enter your password"
                                        required>

                                    <button
                                        class="btn btn-outline-secondary"
                                        type="button"
                                        id="toggleConfirmPassword">

                                        <i class="bi bi-eye"></i>

                                    </button>

                                </div>

                            </div>

                            <!-- Terms -->

                            <div class="form-check mb-4">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="terms"
                                    required>

                                <label class="form-check-label" for="terms">

                                    I agree to the
                                    <a href="#" class="text-decoration-none">
                                        Terms & Conditions
                                    </a>
                                    and
                                    <a href="#" class="text-decoration-none">
                                        Privacy Policy
                                    </a>

                                </label>

                            </div>

                            <!-- Submit Button -->

                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-primary btn-lg">

                                    <i class="bi bi-person-plus-fill"></i>

                                    Create Account

                                </button>

                            </div>

                        </form>

                        <!-- FORM END -->

                        <hr class="my-4">

                        <div class="text-center">

                            <p class="mb-0">

                                Already have an account?

                                <a href="/login" class="fw-semibold">

                                    Login Here

                                </a>

                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- Footer -->

    <footer class="text-center py-3">

        <p class="mb-0">

            © 2026 AASRAA Skillability Centre | Computer Application Mock Test Portal

        </p>

    </footer>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Register JS -->

    <script src="/js/register.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Reset Password | AASRAA Skillability Centre</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet"
        href="/css/reset-password.css">

</head>

<body>

    <nav class="navbar navbar-light bg-white shadow-sm">

        <div class="container">

            <a class="navbar-brand fw-bold"
                href="/">

                <i class="bi bi-mortarboard-fill text-primary"></i>

                Skillability Centre

            </a>

        </div>

    </nav>


    <section class="reset-password-section">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-5">

                    <div class="reset-password-card">

                        <div class="text-center mb-4">

                            <i class="bi bi-shield-lock-fill reset-icon"></i>

                            <h2 class="mt-3">
                                Reset Password
                            </h2>

                            <p class="text-muted">
                                Create a new password for your account.
                            </p>

                        </div>


                        <div id="message"
                            class="alert d-none">
                        </div>


                        <form id="resetPasswordForm">

                            <!-- New Password -->

                            <div class="mb-3">

                                <label
                                    for="newPassword"
                                    class="form-label">

                                    New Password

                                </label>

                                <div class="input-group">

                                    <input
                                        type="password"
                                        class="form-control"
                                        id="newPassword"
                                        placeholder="Enter new password"
                                        required>

                                    <button
                                        type="button"
                                        class="btn btn-outline-secondary"
                                        id="toggleNewPassword">

                                        <i class="bi bi-eye"></i>

                                    </button>

                                </div>

                            </div>


                            <!-- Confirm Password -->

                            <div class="mb-4">

                                <label
                                    for="confirmPassword"
                                    class="form-label">

                                    Confirm Password

                                </label>

                                <div class="input-group">

                                    <input
                                        type="password"
                                        class="form-control"
                                        id="confirmPassword"
                                        placeholder="Confirm new password"
                                        required>

                                    <button
                                        type="button"
                                        class="btn btn-outline-secondary"
                                        id="toggleConfirmPassword">

                                        <i class="bi bi-eye"></i>

                                    </button>

                                </div>

                            </div>


                            <!-- Reset Button -->

                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-primary btn-lg"
                                    id="resetPasswordBtn">

                                    <i class="bi bi-key-fill"></i>

                                    Reset Password

                                </button>

                            </div>

                        </form>


                        <div class="text-center mt-4">

                            <a href="/login"
                                class="text-decoration-none">

                                Back to Login

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <footer class="text-center py-3">

        <div class="container">

            <p class="mb-0 text-muted">

                © 2026 AASRAA Skillability Centre

            </p>

        </div>

    </footer>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="/js/reset-password.js"></script>

</body>

</html>

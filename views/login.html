<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================
            META TAGS
    =========================================== -->

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | AASRAA Skillability Centre</title>

    <meta name="description" content="Login to access Computer Application Mock Tests.">

    <!-- Bootstrap CSS -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Login CSS -->

    <link rel="stylesheet" href="/css/login.css">

</head>

<body>

    <!-- ==========================
            NAVBAR
    =========================== -->

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">

        <div class="container">

            <a class="navbar-brand fw-bold" href="/">
                <img src="/images/logo.png" alt="AASRAA Logo" width="40" height="40" class="d-inline-block align-text-top me-2">

                <i class="bi bi-mortarboard-fill text-primary"></i>

                Skillability Centre

            </a>

            <a href="/register" class="btn btn-outline-primary">

                Register

            </a>

        </div>

    </nav>

    <!-- ==========================
            LOGIN SECTION
    =========================== -->

    <section class="login-section">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-6">

                    <div class="login-card">

                        <div class="text-center mb-4">

                            <h2>

                                Welcome Back

                            </h2>

                            <p>

                                Login to continue your learning journey.

                            </p>

                        </div>

                        <!-- LOGIN FORM -->

                        <form id="loginForm">

                            <!-- Email -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Email Address

                                </label>

                                <input type="email" class="form-control" id="email" placeholder="Enter your email"
                                    required>

                            </div>

                            <!-- Password -->

                            <div class="mb-3">

                                <label class="form-label">

                                    Password

                                </label>

                                <div class="input-group">

                                    <input type="password" class="form-control" id="password"
                                        placeholder="Enter your password" required>

                                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">

                                        <i class="bi bi-eye"></i>

                                    </button>

                                </div>

                            </div>

                            <!-- Remember -->

                            <div class="d-flex justify-content-between align-items-center mb-4">

                                <div class="form-check">

                                    <input class="form-check-input" type="checkbox" id="rememberMe">

                                    <label class="form-check-label" for="rememberMe">

                                        Remember Me

                                    </label>

                                </div>

                                <a href="/forgot-password" class="forgot-link">

                                    Forgot Password?

                                </a>

                            </div>

                            <!-- Login Button -->

                            <div class="d-grid">

                                <button type="submit" class="btn btn-primary btn-lg">

                                    <i class="bi bi-box-arrow-in-right"></i>

                                    Login

                                </button>

                            </div> <!-- End Login Button -->

                        </form>

                        <!-- Divider -->

                        <div class="text-center my-4">

                            <span class="text-muted">

                                ───────── OR ─────────

                            </span>

                        </div>

                        <!-- Register Link -->

                        <div class="text-center">

                            <p class="mb-0">

                                Don't have an account?

                                <a href="/register" class="fw-semibold">

                                    Register

                                </a>

                            </p>

                        </div>
                        <!-- Admin Login -->

                        <div class="text-center mt-4">

                            <small class="text-muted d-block mb-2">

                                Administrator Access

                            </small>

                            <a href="/admin-login" class="btn btn-outline-dark">

                                <i class="bi bi-shield-lock-fill"></i>

                                Admin Login

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- ==========================
            FOOTER
    =========================== -->

    <footer class="text-center py-3">

        <div class="container">

            <p class="mb-0">

                © 2026 AASRAA Skillability Centre |

                Computer Application Mock Test Portal

            </p>

        </div>

    </footer>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Login JS -->

    <script src="/js/login.js"></script>

</body>

</html>
